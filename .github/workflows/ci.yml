name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # FoundationModels needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: ./scripts/test.sh
      # The test step already compiled a release build with -enable-testing (for the speed tests). Building the
      # app with the same flags reuses it; without them, everything compiled a third time. This app is only a
      # check that packaging works: releases are built by scripts/release.sh, without the flag.
      - name: Build app
        run: NOOK_SWIFT_FLAGS="-Xswiftc -enable-testing" ./scripts/build-app.sh
